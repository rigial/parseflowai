<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParseFlowAI - Upload Resume</title>
    <style>
        :root {
            --primary: #171717;
            --primary-hover: #262626;
            --bg: #fafafa;
            --surface: #ffffff;
            --surface-secondary: #f4f4f5;
            --border: #e4e4e7;
            --border-focus: #a1a1aa;
            --text: #09090b;
            --text-muted: #71717a;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            --error: #dc2626;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Navigation */
        header {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.875rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .logo-badge {
            background-color: var(--text);
            color: var(--surface);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        nav {
            display: flex;
            gap: 0.5rem;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-sm);
            transition: all 0.15s ease;
        }

        .nav-link:hover {
            color: var(--text);
            background-color: var(--surface-secondary);
        }

        .nav-link.active {
            color: var(--text);
            background-color: var(--surface-secondary);
            font-weight: 600;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 2.25rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 1rem;
            background-color: var(--bg);
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--border-focus);
            background-color: var(--surface);
        }

        .upload-area p {
            margin-bottom: 0;
            font-size: 0.875rem;
            color: var(--text);
            font-weight: 500;
        }

        .upload-area span {
            color: var(--text-muted);
            font-weight: normal;
        }

        #file-input {
            display: none;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s ease;
            text-align: center;
            text-decoration: none;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-parse {
            background-color: #2563eb;
            margin-top: 0.75rem;
        }

        .btn-parse:hover {
            background-color: #1d4ed8;
        }

        #status {
            margin-top: 1rem;
            font-size: 0.875rem;
            padding: 0.875rem;
            border-radius: var(--radius-sm);
            display: none;
            word-break: break-all;
        }

        .status-success {
            background-color: var(--success-bg);
            color: var(--success);
            border: 1px solid var(--success-border);
        }

        .status-error {
            background-color: var(--error-bg);
            color: var(--error);
            border: 1px solid var(--error-border);
        }

        .status-loading {
            background-color: var(--surface-secondary);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        .file-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }

        .resume-id-box {
            margin-top: 0.75rem;
            padding: 0.65rem;
            background: var(--surface-secondary);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 0.8125rem;
            color: var(--text);
            border: 1px solid var(--border);
            user-select: all;
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">
        <span>ParseFlowAI</span>
        <span class="logo-badge">API Test</span>
    </a>
    <nav>
        <a href="index.html" class="nav-link active">1. Upload Resume</a>
        <a href="parse.html" class="nav-link">2. Parse JSON</a>
    </nav>
</header>

<main>
    <div class="container">
        <h1>Test File Upload</h1>
        <p>Upload a PDF resume to test the presigned URL flow to S3.</p>

        <div id="upload-area" class="upload-area" onclick="document.getElementById('file-input').click()">
            <p>Click to select a PDF <br><span>or drag and drop here</span></p>
        </div>
        <input type="file" id="file-input" accept="application/pdf">

        <div id="file-info" class="file-info" style="display: none;">
            <span id="file-name" style="font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
            <button id="clear-btn" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem;">&times;</button>
        </div>

        <button id="upload-btn" class="btn" disabled>Upload to S3</button>

        <div id="status"></div>
        <div id="next-action" style="display: none;">
            <a id="proceed-to-parse-btn" href="parse.html" class="btn btn-parse">
                Proceed to Parse with Schema &rarr;
            </a>
        </div>
    </div>
</main>

<script>
    const API_URL = 'https://xaz11sovtd.execute-api.ap-south-1.amazonaws.com/v1/resumes/upload-url';
    
    const fileInput = document.getElementById('file-input');
    const uploadArea = document.getElementById('upload-area');
    const fileInfo = document.getElementById('file-info');
    const fileNameDisplay = document.getElementById('file-name');
    const clearBtn = document.getElementById('clear-btn');
    const uploadBtn = document.getElementById('upload-btn');
    const statusDiv = document.getElementById('status');
    const nextActionDiv = document.getElementById('next-action');
    const proceedBtn = document.getElementById('proceed-to-parse-btn');

    let selectedFile = null;

    // Handle Drag & Drop
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            handleFileSelect(e.dataTransfer.files[0]);
        }
    });

    // Handle File Input Change
    fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files.length > 0) {
            handleFileSelect(e.target.files[0]);
        }
    });

    function handleFileSelect(file) {
        if (file.type !== 'application/pdf') {
            showStatus('Please select a valid PDF file.', 'error');
            return;
        }

        selectedFile = file;
        fileNameDisplay.textContent = file.name;
        uploadArea.style.display = 'none';
        fileInfo.style.display = 'flex';
        uploadBtn.disabled = false;
        statusDiv.style.display = 'none';
        nextActionDiv.style.display = 'none';
    }

    clearBtn.addEventListener('click', () => {
        selectedFile = null;
        fileInput.value = '';
        uploadArea.style.display = 'block';
        fileInfo.style.display = 'none';
        uploadBtn.disabled = true;
        nextActionDiv.style.display = 'none';
    });

    function showStatus(message, type, htmlContent = null) {
        if (htmlContent) {
            statusDiv.innerHTML = htmlContent;
        } else {
            statusDiv.textContent = message;
        }
        statusDiv.className = `status-${type}`;
        statusDiv.style.display = 'block';
    }

    uploadBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        uploadBtn.disabled = true;
        uploadBtn.textContent = 'Generating URL...';
        showStatus('Requesting secure upload link...', 'loading');
        nextActionDiv.style.display = 'none';

        try {
            // 1. Get Presigned URL
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fileName: selectedFile.name,
                    contentType: selectedFile.type
                })
            });

            const data = await res.json();

            if (!res.ok || !data.success) {
                throw new Error(data.error?.message || 'Failed to get upload URL');
            }

            const { uploadUrl, resumeId } = data.data;

            // 2. Upload to S3 directly
            uploadBtn.textContent = 'Uploading to S3...';
            showStatus('Uploading file to AWS S3...', 'loading');

            const s3Res = await fetch(uploadUrl, {
                method: 'PUT',
                headers: {
                    'Content-Type': selectedFile.type
                },
                body: selectedFile
            });

            if (!s3Res.ok) {
                throw new Error(`S3 Upload failed: ${s3Res.statusText}. Make sure CORS is configured on your S3 bucket!`);
            }

            showStatus(
                '',
                'success',
                `<strong>✅ Upload successful!</strong><br>Resume ID: <div class="resume-id-box">${resumeId}</div>`
            );
            uploadBtn.textContent = 'Upload Complete';
            
            proceedBtn.href = `parse.html?resumeId=${encodeURIComponent(resumeId)}`;
            nextActionDiv.style.display = 'block';

        } catch (error) {
            console.error(error);
            showStatus(`❌ ${error.message}`, 'error');
            uploadBtn.textContent = 'Upload to S3';
            uploadBtn.disabled = false;
        }
    });
</script>

</body>
</html>
