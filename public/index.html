<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParseFlowAI - Upload Resume</title>
    <meta name="description" content="Upload PDF resumes securely to S3 via presigned URLs and ParseFlowAI API.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #18181b;
            --primary-hover: #27272a;
            --bg: #fafafa;
            --surface: #ffffff;
            --surface-secondary: #f4f4f5;
            --border: #e4e4e7;
            --border-focus: #71717a;
            --text: #09090b;
            --text-muted: #71717a;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            --error: #dc2626;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Header Navigation */
        header {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.875rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .logo-badge {
            background-color: var(--primary);
            color: #ffffff;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-sm);
            transition: all 0.15s ease;
        }

        .nav-link:hover {
            color: var(--text);
            background-color: var(--surface-secondary);
        }

        .nav-link.active {
            color: var(--text);
            background-color: var(--surface-secondary);
            font-weight: 600;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem 1rem;
        }

        .container {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.25rem 2rem;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
            letter-spacing: -0.025em;
            color: var(--text);
        }

        p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }

        /* API Key input box */
        .api-key-section {
            background-color: var(--surface-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 0.875rem 1rem;
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .api-key-section label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .api-key-input {
            width: 100%;
            font-family: var(--font-mono);
            font-size: 0.8125rem;
            padding: 0.5rem 0.65rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background-color: var(--surface);
            color: var(--text);
            outline: none;
        }

        .api-key-input:focus {
            border-color: var(--border-focus);
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 2.25rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 1rem;
            background-color: var(--bg);
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--border-focus);
            background-color: var(--surface);
        }

        .upload-area p {
            margin-bottom: 0;
            font-size: 0.875rem;
            color: var(--text);
            font-weight: 500;
        }

        .upload-area span {
            color: var(--text-muted);
            font-weight: normal;
        }

        #file-input {
            display: none;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            text-decoration: none;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-parse {
            background-color: var(--primary);
            margin-top: 0.75rem;
            border: 1px solid var(--primary);
        }

        #status {
            margin-top: 1rem;
            font-size: 0.875rem;
            padding: 0.875rem 1rem;
            border-radius: var(--radius-sm);
            display: none;
            word-break: break-all;
        }

        .status-success {
            background-color: var(--success-bg);
            color: var(--success);
            border: 1px solid var(--success-border);
        }

        .status-error {
            background-color: var(--error-bg);
            color: var(--error);
            border: 1px solid var(--error-border);
        }

        .status-loading {
            background-color: var(--surface-secondary);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        .file-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }

        .resume-id-box {
            margin-top: 0.75rem;
            padding: 0.65rem 0.85rem;
            background: var(--surface);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 0.8125rem;
            color: var(--text);
            border: 1px solid var(--border);
            user-select: all;
        }
    </style>
</head>
<body>

<header>
    <a href="/dashboard.html" class="logo">
        <span>ParseFlowAI</span>
        <span class="logo-badge">Developer Portal</span>
    </a>
    <nav>
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/index.html" class="nav-link active">1. Upload Resume</a>
        <a href="/parse.html" class="nav-link">2. Parse JSON</a>
        <a href="/auth.html" class="nav-link" id="auth-link">Account</a>
    </nav>
</header>

<main>
    <div class="container">
        <h1>Upload Resume</h1>
        <p>Generate a secure S3 upload URL and test the extraction pipeline.</p>

        <!-- API Key Selection / Input -->
        <div class="api-key-section">
            <label for="api-key-input">
                API Key (Bearer Auth)
                <a href="/dashboard.html" style="text-decoration:none; color:var(--text); font-weight:600;">Get Key &rarr;</a>
            </label>
            <input type="password" id="api-key-input" class="api-key-input" placeholder="pf_live_...">
        </div>

        <div id="upload-area" class="upload-area" onclick="document.getElementById('file-input').click()">
            <p>Click to select a PDF <br><span>or drag and drop here</span></p>
        </div>
        <input type="file" id="file-input" accept="application/pdf">

        <div id="file-info" class="file-info" style="display: none;">
            <span id="file-name" style="font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
            <button id="clear-btn" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem;">&times;</button>
        </div>

        <button id="upload-btn" class="btn">Upload to S3</button>

        <div id="status"></div>
        <div id="next-action" style="display: none;">
            <a id="proceed-to-parse-btn" href="parse.html" class="btn btn-parse">
                Proceed to Parse with Custom Schema &rarr;
            </a>
        </div>
    </div>
</main>

<script>
    const API_URL = '/v1/resumes/upload-url';
    
    const fileInput = document.getElementById('file-input');
    const uploadArea = document.getElementById('upload-area');
    const fileInfo = document.getElementById('file-info');
    const fileNameDisplay = document.getElementById('file-name');
    const clearBtn = document.getElementById('clear-btn');
    const uploadBtn = document.getElementById('upload-btn');
    const statusDiv = document.getElementById('status');
    const nextActionDiv = document.getElementById('next-action');
    const proceedBtn = document.getElementById('proceed-to-parse-btn');
    const apiKeyInput = document.getElementById('api-key-input');

    let selectedFile = null;

    // Load active API Key from localStorage if present
    const savedKey = localStorage.getItem('parseflow_active_api_key');
    if (savedKey) {
        apiKeyInput.value = savedKey;
    }

    const saveKey = () => {
        if (apiKeyInput.value.trim()) {
            localStorage.setItem('parseflow_active_api_key', apiKeyInput.value.trim());
        }
    };
    apiKeyInput.addEventListener('input', saveKey);
    apiKeyInput.addEventListener('change', saveKey);
    apiKeyInput.addEventListener('paste', () => setTimeout(saveKey, 50));

    // Handle Drag & Drop
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            handleFileSelect(e.dataTransfer.files[0]);
        }
    });

    // Handle File Input Change
    fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files.length > 0) {
            handleFileSelect(e.target.files[0]);
        }
    });

    function handleFileSelect(file) {
        if (file.type !== 'application/pdf') {
            showStatus('Please select a valid PDF file.', 'error');
            return;
        }

        selectedFile = file;
        fileNameDisplay.textContent = file.name;
        uploadArea.style.display = 'none';
        fileInfo.style.display = 'flex';
        statusDiv.style.display = 'none';
        nextActionDiv.style.display = 'none';
    }

    clearBtn.addEventListener('click', () => {
        selectedFile = null;
        fileInput.value = '';
        uploadArea.style.display = 'block';
        fileInfo.style.display = 'none';
        nextActionDiv.style.display = 'none';
    });

    function showStatus(message, type, htmlContent = null) {
        if (htmlContent) {
            statusDiv.innerHTML = htmlContent;
        } else {
            statusDiv.textContent = message;
        }
        statusDiv.className = `status-${type}`;
        statusDiv.style.display = 'block';
    }

    uploadBtn.addEventListener('click', async () => {
        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) {
            apiKeyInput.focus();
            showStatus('Please enter an API Key above or create one in the Dashboard.', 'error');
            return;
        }

        if (!selectedFile) {
            fileInput.click();
            showStatus('Please select a PDF resume file to upload.', 'error');
            return;
        }

        uploadBtn.disabled = true;
        uploadBtn.textContent = 'Generating URL...';
        showStatus('Requesting presigned upload URL from ParseFlowAI API...', 'loading');
        nextActionDiv.style.display = 'none';

        try {
            // 1. Get Presigned URL
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
            };

            const res = await fetch(API_URL, {
                method: 'POST',
                headers,
                body: JSON.stringify({
                    fileName: selectedFile.name,
                    contentType: selectedFile.type,
                    fileSizeBytes: selectedFile.size
                })
            });

            const data = await res.json();

            if (!res.ok || !data.success) {
                throw new Error(data.error?.message || 'Failed to get upload URL');
            }

            const { uploadUrl, resumeId } = data.data;

            // 2. Upload to S3 directly
            uploadBtn.textContent = 'Uploading to S3...';
            showStatus('Uploading file to AWS S3 storage...', 'loading');

            const s3Res = await fetch(uploadUrl, {
                method: 'PUT',
                headers: {
                    'Content-Type': selectedFile.type
                },
                body: selectedFile
            });

            if (!s3Res.ok) {
                throw new Error(`S3 Upload failed (${s3Res.statusText}). Check S3 CORS configuration.`);
            }

            showStatus(
                '',
                'success',
                `<strong>✅ Upload successful!</strong><br>Resume ID: <div class="resume-id-box">${resumeId}</div>`
            );
            uploadBtn.textContent = 'Upload Complete';
            
            proceedBtn.href = `parse.html?resumeId=${encodeURIComponent(resumeId)}`;
            nextActionDiv.style.display = 'block';

        } catch (error) {
            console.error(error);
            showStatus(`❌ ${error.message}`, 'error');
            uploadBtn.textContent = 'Upload to S3';
            uploadBtn.disabled = false;
        }
    });
</script>

</body>
</html>
