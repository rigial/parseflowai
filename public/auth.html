<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParseFlowAI - Authentication & Developer Portal</title>
    <meta name="description" content="Sign up or log in to ParseFlowAI to manage your API keys, view token usage, and track resume parsing metrics.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #18181b;
            --primary-hover: #27272a;
            --bg: #fafafa;
            --surface: #ffffff;
            --surface-secondary: #f4f4f5;
            --surface-tertiary: #e4e4e7;
            --border: #e4e4e7;
            --border-focus: #71717a;
            --text: #09090b;
            --text-muted: #71717a;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            --error: #dc2626;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Header */
        header {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.875rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .logo-badge {
            background-color: var(--primary);
            color: #ffffff;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        nav {
            display: flex;
            gap: 0.5rem;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-sm);
            transition: all 0.15s ease;
        }

        .nav-link:hover {
            color: var(--text);
            background-color: var(--surface-secondary);
        }

        .nav-link.active {
            color: var(--text);
            background-color: var(--surface-secondary);
            font-weight: 600;
        }

        /* Main Center Layout */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem 1rem;
        }

        .auth-container {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.25rem 2rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .auth-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.025em;
            margin-bottom: 0.35rem;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background-color: var(--surface-secondary);
            padding: 0.25rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .tab-btn.active {
            background-color: var(--surface);
            color: var(--text);
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        /* Form */
        form {
            display: flex;
            flex-direction: column;
            gap: 1.15rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text);
            display: flex;
            justify-content: space-between;
        }

        .label-hint {
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 0.65rem 0.85rem;
            font-family: inherit;
            font-size: 0.875rem;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            transition: all 0.15s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--border-focus);
            background-color: var(--surface);
            box-shadow: 0 0 0 3px rgba(24, 24, 27, 0.06);
        }

        .toggle-pw-btn {
            position: absolute;
            right: 0.65rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
        }

        .toggle-pw-btn:hover {
            color: var(--text);
        }

        .btn-submit {
            margin-top: 0.5rem;
            padding: 0.75rem 1rem;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Alert notifications */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.8125rem;
            display: none;
            animation: fadeIn 0.2s ease-out forwards;
        }

        .alert-error {
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error);
        }

        .alert-success {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success);
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
        }

        /* Footer info */
        .auth-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.8125rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 1.25rem;
        }

        .auth-footer a {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<header>
    <a href="/index.html" class="logo">
        ParseFlowAI
        <span class="logo-badge">SaaS API</span>
    </a>
    <nav>
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/index.html" class="nav-link">Upload Demo</a>
        <a href="/parse.html" class="nav-link">Parse Demo</a>
        <a href="/auth.html" class="nav-link active" id="auth-nav-link">Sign In</a>
    </nav>
</header>

<main>
    <div class="auth-container">
        <div class="auth-header">
            <h1 id="form-title">Welcome back</h1>
            <p id="form-subtitle">Log in to manage your API keys and view usage</p>
        </div>

        <div class="tabs">
            <button type="button" class="tab-btn active" id="tab-login" onclick="switchMode('login')">Sign In</button>
            <button type="button" class="tab-btn" id="tab-signup" onclick="switchMode('signup')">Create Account</button>
        </div>

        <div id="alert-box" class="alert"></div>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" required placeholder="you@company.com" autocomplete="email" autofocus>
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                    <span class="label-hint" id="pw-hint" style="display: none;">Min. 8 characters</span>
                </label>
                <div class="input-wrapper">
                    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                    <button type="button" class="toggle-pw-btn" onclick="togglePasswordVisibility()">Show</button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btn-submit">
                <span id="btn-text">Sign In</span>
            </button>
        </form>

        <div class="auth-footer">
            <span id="footer-text">Don't have an account?</span>
            <a href="javascript:void(0)" id="footer-link" onclick="toggleMode()">Create one now</a>
        </div>
    </div>
</main>

<script>
    let mode = 'login'; // 'login' | 'signup'

    // Check if user is already logged in
    async function checkExistingSession() {
        try {
            const res = await fetch('/v1/auth/me');
            if (res.ok) {
                const data = await res.json();
                if (data.success && data.user) {
                    window.location.href = '/dashboard.html';
                }
            }
        } catch {}
    }
    checkExistingSession();

    function switchMode(newMode) {
        mode = newMode;
        const isLogin = mode === 'login';

        document.getElementById('tab-login').classList.toggle('active', isLogin);
        document.getElementById('tab-signup').classList.toggle('active', !isLogin);

        document.getElementById('form-title').innerText = isLogin ? 'Welcome back' : 'Create your account';
        document.getElementById('form-subtitle').innerText = isLogin 
            ? 'Log in to manage your API keys and view usage' 
            : 'Get started with ParseFlowAI self-serve API in seconds';

        document.getElementById('btn-text').innerText = isLogin ? 'Sign In' : 'Create Account';
        document.getElementById('pw-hint').style.display = isLogin ? 'none' : 'inline';
        document.getElementById('footer-text').innerText = isLogin ? "Don't have an account?" : "Already have an account?";
        document.getElementById('footer-link').innerText = isLogin ? "Create one now" : "Sign in";

        hideAlert();
    }

    function toggleMode() {
        switchMode(mode === 'login' ? 'signup' : 'login');
    }

    function togglePasswordVisibility() {
        const input = document.getElementById('password');
        const btn = document.querySelector('.toggle-pw-btn');
        if (input.type === 'password') {
            input.type = 'text';
            btn.innerText = 'Hide';
        } else {
            input.type = 'password';
            btn.innerText = 'Show';
        }
    }

    function showAlert(msg, isError = true) {
        const box = document.getElementById('alert-box');
        box.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
        box.innerText = msg;
        box.style.display = 'block';
    }

    function hideAlert() {
        const box = document.getElementById('alert-box');
        box.style.display = 'none';
    }

    async function handleAuth(e) {
        e.preventDefault();
        hideAlert();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('btn-submit');
        const btnText = document.getElementById('btn-text');

        if (!email || !password) {
            showAlert('Please enter both email and password.');
            return;
        }

        if (mode === 'signup' && password.length < 8) {
            showAlert('Password must be at least 8 characters long.');
            return;
        }

        // Set Loading state
        btn.disabled = true;
        btnText.innerHTML = `<span class="spinner"></span> Processing...`;

        try {
            const endpoint = mode === 'signup' ? '/v1/auth/signup' : '/v1/auth/login';
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                const message = result.error?.message || 'Authentication failed. Please try again.';
                showAlert(message, true);
                return;
            }

            if (mode === 'signup') {
                // If signup succeeded, automatically log them in
                showAlert('Account created! Logging you in...', false);
                const loginRes = await fetch('/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });
                if (loginRes.ok) {
                    window.location.href = '/dashboard.html';
                } else {
                    switchMode('login');
                    showAlert('Account created successfully. Please sign in.', false);
                }
            } else {
                showAlert('Login successful! Redirecting...', false);
                window.location.href = '/dashboard.html';
            }
        } catch (err) {
            showAlert('Network error. Please ensure the backend server is reachable.');
        } finally {
            btn.disabled = false;
            btnText.innerText = mode === 'login' ? 'Sign In' : 'Create Account';
        }
    }
</script>

</body>
</html>
